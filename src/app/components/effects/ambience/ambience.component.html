<div class="effect-group">
    <div class="slider-container">
        <h3>Ambience</h3>
        <input
            type="range"
            min="0"
            max="100"
            [(ngModel)]="ambienceVolume"
            (input)="updateVolume(ambienceVolume)"
            class="styled-range ambience">
    </div>
    <div class="buttons">
        <button
            *ngFor="let ambience of ambienceKeys"
            (click)="toggleAmbience(ambience)"
            [ngClass]="{
                'active-btn': activeAmbience === ambience,
                'glow-btn': activeAmbience !== ambience
            }">
            {{ ambience }}
        </button>
    </div>
</div>
